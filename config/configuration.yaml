# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# MQTT (broker `mosquitto-dev`, port 1883, no auth) and the Frigate integration
# (URL `http://frigate-dev:5000`) are configured through the UI; see README.md "Development".

logger:
  default: info
  logs:
    custom_components.frigate_feed: debug
